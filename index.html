<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동 기록</title>
<meta name="theme-color" content="#16181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="운동 기록">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2316181D'/%3E%3Crect x='30' y='78' width='120' height='24' rx='4' fill='%231F4FD8'/%3E%3Crect x='18' y='62' width='22' height='56' rx='5' fill='%23fff'/%3E%3Crect x='140' y='62' width='22' height='56' rx='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181D; --ink-2:#3C4149; --ink-3:#787F8A;
  --paper:#E9EAE4; --card:#FFFFFF; --line:#D2D4CC;
  --signal:#1F4FD8; --caution:#C97A0B; --alert:#C0392B; --ok:#2E7D5B;
  --grid:rgba(22,24,29,.055);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:96px;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:Archivo,Pretendard,sans-serif;font-weight:800;letter-spacing:-.02em}

header{background:var(--ink);color:#fff;padding:max(18px,env(safe-area-inset-top)) 0 16px;border-bottom:3px solid var(--signal)}
.hd-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hd-day{font-size:34px;line-height:1;text-transform:uppercase}
.hd-meta{text-align:right;font-size:12px;color:#A8AEB8}
.hd-focus{display:inline-block;margin-top:10px;padding:3px 9px;border-radius:2px;background:var(--signal);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em}
.hd-focus.rest{background:#565C66}
.hd-datebtn{background:none;border:0;padding:0;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.hd-datebtn .pen{opacity:.6;font-size:10px}
.hd-datebtn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pastbar{background:var(--caution);color:#fff;font-size:12px;font-weight:600;padding:8px 14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.pastbar button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:2px;padding:3px 9px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
.hd-body{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 9px;border:1px solid #3A404A;border-radius:2px;background:transparent;color:#A8AEB8;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer}
.hd-body b{font-family:'JetBrains Mono',monospace;color:#fff;font-weight:700;font-size:12px}
.hd-body:active{background:#22262E}
.hd-body .pen{opacity:.7;font-size:10px}
.hd-body.editing{border-color:var(--signal)}
.hd-body input{width:44px;border:0;background:none;color:#fff;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;text-align:right;padding:0;touch-action:none}
.hd-body input:focus{outline:none}
.hd-prog{margin-top:12px;height:4px;background:#2C3038;border-radius:2px;overflow:hidden}
.hd-prog i{display:block;height:100%;width:0;background:var(--signal);transition:width .35s ease}
.hd-prog-lbl{margin-top:5px;font-size:11px;color:#A8AEB8;display:flex;justify-content:space-between}
.banner{background:var(--caution);color:#fff;font-size:12px;padding:7px 14px;text-align:center}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 0 max(6px,env(safe-area-inset-bottom));display:flex}
nav button{flex:1;background:none;border:0;padding:9px 2px 7px;font-family:inherit;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button .dot{width:20px;height:3px;border-radius:2px;background:transparent}
nav button[aria-selected="true"]{color:var(--ink)}
nav button[aria-selected="true"] .dot{background:var(--signal)}

section[hidden]{display:none}
.pane{padding-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}
.card.active{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.card.done{opacity:.62}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);background:#FBFBF9}
.card.active .card-hd{background:#F4F6FD}
.card-hd h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.card-bd{padding:13px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow:first-child{margin-top:0}
.spec{font-size:12px;color:var(--ink-3);line-height:1.5}
.spec b{color:var(--ink-2);font-weight:600}
.ex-target{font-size:11.5px;color:var(--signal);font-weight:600;font-family:'JetBrains Mono',monospace}
.tick{color:var(--ok);font-size:13px}

/* 러닝 프로필 */
.rp{padding:13px 13px 6px}
.rp svg{width:100%;height:112px;display:block}
.rp-legend{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);padding:0 2px 8px}
.rp-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.rp-tbl th{text-align:left;font-size:10px;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding:0 8px 6px;border-bottom:1px solid var(--line)}
.rp-tbl td{padding:7px 8px;border-bottom:1px solid #EFEFEA}
.rp-tbl tr:last-child td{border-bottom:0}
.rp-tbl td:first-child{color:var(--ink-3)}
.rp-tbl td.v{font-family:'JetBrains Mono',monospace;font-weight:700}

/* 스테퍼 */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.f>label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);margin-bottom:4px;text-align:center}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:#FBFBF9}
.step button{width:32px;flex:none;border:0;background:#F1F1EC;color:var(--ink-2);font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;cursor:pointer;padding:0}
.step button:active{background:var(--ink);color:#fff}
.step input{flex:1;width:100%;min-width:0;border:0;background:none;padding:10px 2px;font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;text-align:center;color:var(--ink)}
.step input:focus{outline:2px solid var(--signal);outline-offset:-2px}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input[type=number]{-moz-appearance:textfield}

/* 참고 기준 */
.bench{margin:0 0 12px;padding:9px 11px;background:#FBFBF9;border:1px solid var(--line);border-radius:2px}
.bench-hd{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);margin-bottom:7px}
.bar{position:relative;height:22px;background:#EDEDE7;border-radius:2px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0}
.bar .b1{background:#E4EAF0}
.bar .b2{background:#D3DEF3}
.bar .b3{background:#BCCDF0}
.bar .me{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px;z-index:3;transition:left .3s}
.bar .me::after{content:attr(data-v);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap}
.bar-key{display:flex;font-size:9.5px;color:var(--ink-3);margin-top:4px}
.bar-key span{text-align:center}
.bench-msg{font-size:11.5px;margin-top:9px;color:var(--ink-2);line-height:1.5}
.bench-msg b{font-weight:700}

/* 세트 카드 */
.sets{display:flex;gap:7px;margin-bottom:11px}
.setcard{
  flex:1;border:1px solid var(--line);background:#FBFBF9;border-radius:3px;
  padding:13px 4px 11px;font-family:inherit;cursor:pointer;text-align:center;
  transition:transform .12s ease,background .2s,border-color .2s;
}
.setcard .n{display:block;font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:var(--ink-3);line-height:1}
.setcard .l{display:block;font-size:10px;color:var(--ink-3);margin-top:5px;font-weight:600}
.setcard[data-state="next"]{border-color:var(--signal);background:#F4F6FD}
.setcard[data-state="next"] .n,.setcard[data-state="next"] .l{color:var(--signal)}
.setcard[data-state="done"]{background:var(--ok);border-color:var(--ok)}
.setcard[data-state="done"] .n,.setcard[data-state="done"] .l{color:#fff}
.setcard[disabled]{cursor:default}
.setcard.pop{transform:scale(.93)}

.startbtn{width:100%;padding:13px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px}
.startbtn:active{background:#000}

.react{
  margin:0 0 11px;padding:11px 12px;border-left:3px solid var(--ok);background:#EFF6F2;
  font-size:13px;line-height:1.5;color:#1F5B41;font-weight:600;
  animation:slidein .3s ease;
}
.react.rest{border-left-color:var(--signal);background:#F1F4FD;color:#1A3E9E}
.react .t{font-family:'JetBrains Mono',monospace;font-weight:700}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

.rpe-lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.rpe-lbl span:first-child{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.rpe-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.scale button{border:1px solid var(--line);background:#FBFBF9;border-radius:2px;padding:8px 0;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.scale-key{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);margin-top:5px}

.joint{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #EFEFEA}
.joint:last-child{border-bottom:0}
.joint-name{width:62px;font-size:13px;font-weight:600;flex:none}
.joint-opts{display:flex;gap:4px;flex:1}
.joint-opts button{flex:1;border:1px solid var(--line);background:#FBFBF9;border-radius:2px;padding:7px 2px;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer}
.joint-opts button[aria-pressed="true"]{color:#fff;border-color:transparent}
.joint-opts button[data-v="0"][aria-pressed="true"]{background:var(--ok)}
.joint-opts button[data-v="1"][aria-pressed="true"]{background:var(--caution)}
.joint-opts button[data-v="2"][aria-pressed="true"],.joint-opts button[data-v="3"][aria-pressed="true"]{background:var(--alert)}
.warn{margin-top:10px;padding:11px 12px;border-left:3px solid var(--alert);background:#FDF3F2;font-size:12.5px;line-height:1.55;color:#8E2B20}
.warn b{display:block;margin-bottom:3px;color:var(--alert)}

.save{width:100%;padding:15px;border:0;border-radius:3px;background:var(--ink);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.save[disabled]{background:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,14px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:3px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.log{border-left:2px solid var(--line);padding-left:14px;margin-left:5px}
.log-item{position:relative;padding-bottom:16px}
.log-item::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--signal);border:2px solid var(--paper)}
.log-date{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--ink-2)}
.log-focus{font-size:11px;color:var(--ink-3);margin-left:6px}
.log-rows{margin-top:6px;font-size:12.5px}
.log-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #E2E3DD}
.log-row:last-child{border-bottom:0}
.log-row .v{font-family:'JetBrains Mono',monospace;color:var(--ink-2);flex:none}
.chip{display:inline-block;padding:1px 6px;border-radius:2px;font-size:10px;font-weight:700;margin-left:5px}
.chip.ok{background:#E4F0EA;color:var(--ok)}
.chip.warn{background:#FBEEDA;color:var(--caution)}
.chip.bad{background:#FBE6E3;color:var(--alert)}
.empty{text-align:center;color:var(--ink-3);font-size:13px;padding:44px 20px;line-height:1.7}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:2px;background:#FBFBF9;font-family:inherit;font-size:14px;color:var(--ink)}
.trend svg{width:100%;height:150px;display:block;margin-top:10px}
.howto-fig{background:#FBFBF9;border-bottom:1px solid var(--line);padding:8px 0}
.howto-fig svg{width:100%;height:130px;display:block}
.howto-steps{margin:0;padding-left:19px;font-size:13.5px;line-height:1.7}
.howto-steps li{margin-bottom:4px}
.howto-steps li::marker{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--signal)}
.tip{margin-top:10px;padding:9px 11px;background:#F4F6FD;border-left:3px solid var(--signal);font-size:12.5px;line-height:1.55}
details.card>summary{list-style:none;padding:12px 13px;font-size:14px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font-family:'JetBrains Mono',monospace;color:var(--ink-3);font-weight:700}
details.card[open]>summary::after{content:"−"}
details.card[open]>summary{border-bottom:1px solid var(--line);background:#FBFBF9}
/* 러닝 스톱워치 */
.runner{position:relative;padding:16px 13px 14px;text-align:center;overflow:hidden;background:#16181D;color:#fff}
.runner .lbl{font-size:10px;letter-spacing:.14em;color:#8A919C;font-weight:700}
.runner .big{font-family:'JetBrains Mono',monospace;font-size:74px;font-weight:700;line-height:.95;letter-spacing:-.04em;margin:4px 0 0}
.runner .unit{font-size:15px;color:#8A919C;font-weight:600;margin-left:4px}
.runner .clock{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;margin-top:8px}
.runner .sub{font-size:12px;color:#A8AEB8;margin-top:5px;line-height:1.5}
.runner .sub b{color:#fff}
.runner-track{display:flex;gap:2px;margin-top:13px;height:7px}
.runner-track i{background:#31363F;border-radius:1px;position:relative;overflow:hidden}
.runner-track i.past{background:#1F4FD8}
.runner-track i.now::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:#1F4FD8}
.runctl{display:flex;gap:7px;margin-top:13px}
.runctl button{flex:1;border:1px solid #3A404A;background:#22262E;color:#fff;border-radius:3px;padding:12px 0;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.runctl button.primary{background:var(--signal);border-color:var(--signal)}
.runctl button.ghost{color:#A8AEB8}
.flash{position:absolute;inset:0;background:var(--signal);opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column}
.flash.on{animation:flash 1.5s ease}
.flash .fv{font-family:'JetBrains Mono',monospace;font-size:62px;font-weight:700;color:#fff;line-height:1}
.flash .ft{font-size:14px;font-weight:700;color:#fff;letter-spacing:.06em;margin-top:4px}
@keyframes flash{0%{opacity:0;transform:scale(1.15)}12%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0}}
.sugg{display:flex;align-items:center;gap:8px;margin:0 0 11px;padding:9px 11px;background:#F1F4FD;border-left:3px solid var(--signal);font-size:12.5px;line-height:1.45;color:#1A3E9E}
.sugg b{font-weight:700}
.sugg button{flex:none;margin-left:auto;border:1px solid var(--signal);background:var(--signal);color:#fff;border-radius:2px;padding:6px 11px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.sugg.hold{background:#FDF6EA;border-left-color:var(--caution);color:#7A4E08}
.warmcard{border-color:var(--caution)!important}
.warmcard[data-state="done"]{background:var(--caution)!important;border-color:var(--caution)!important}
.warmcard[data-state="next"]{background:#FDF6EA!important;border-color:var(--caution)!important}
.warmcard[data-state="next"] .n,.warmcard[data-state="next"] .l{color:var(--caution)!important}
/* 종목별 동작 설명 */
.howto-in{border-top:1px solid var(--line);margin:13px -13px -13px;background:#FBFBF9}
.howto-in>summary{list-style:none;padding:11px 13px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;display:flex;justify-content:space-between}
.howto-in>summary::-webkit-details-marker{display:none}
.howto-in>summary::after{content:"동작 보기 +";font-size:11px;color:var(--ink-3);font-weight:600}
.howto-in[open]>summary::after{content:"접기 −"}
.howto-in .inner{padding:0 13px 13px}
.step input{touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none}
.step.dragging{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.step.dragging input{color:var(--signal)}
.drag-hint{font-size:9.5px;color:var(--ink-3);text-align:center;margin-top:3px}
.daybar{display:flex;gap:4px;margin-top:12px}
.daybar button{flex:1;border:1px solid #363B44;background:transparent;color:#A8AEB8;border-radius:2px;padding:6px 0;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
.daybar button[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--ink)}
.daybar button.today::after{content:"·";display:block;line-height:0;margin-top:3px;font-size:15px}
.donebtn{width:100%;padding:11px;border:1px solid var(--ok);background:#fff;color:var(--ok);border-radius:3px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px}
.donebtn[aria-pressed="true"]{background:var(--ok);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="banner" class="banner" hidden></div>
<div id="pastbar" class="pastbar" hidden></div>

<header>
  <div class="wrap">
    <div class="hd-row">
      <div>
        <div class="hd-day disp" id="hdDay">—</div>
        <div class="hd-focus" id="hdFocus">—</div>
      </div>
      <div class="hd-meta">
        <button type="button" class="hd-datebtn" id="hdDateBtn">
          <span id="hdDate">—</span><span class="pen">📅</span>
          <input type="date" id="datePick">
        </button>
        <div id="hdWeek">—</div>
        <button type="button" class="hd-body" id="hdBody" aria-label="체중 수정">
          체중 <b id="hdBodyVal">—</b>kg <span class="pen">✎</span>
        </button>
      </div>
    </div>
    <div class="daybar" id="dayBar"></div>
    <div class="hd-prog"><i id="progBar"></i></div>
    <div class="hd-prog-lbl"><span id="progTxt">시작 전</span><span class="mono" id="progNum">0 / 0</span></div>
  </div>

let db = null, memory = {};
if (firebaseConfig.apiKey) {
  try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
  catch(e){ console.error(e); showBanner("Firebase 연결 실패 — 이번 기록은 저장되지 않습니다."); }
} else {
  showBanner("Firebase 설정값을 넣기 전입니다. 지금 기록은 새로고침하면 사라집니다.");
}
function showBanner(m){ const b=document.getElementById("banner"); b.textContent=m; b.hidden=false; }
async function saveLog(d,data){ if(db) await db.collection(COLLECTION).doc(USER_ID+"_"+d).set(data); else memory[d]=data; }
let lastLoadError = null;
async function loadLogs(n){
  if(db){
    lastLoadError = null;
    try {
      const q = await db.collection(COLLECTION).orderBy("date","desc").limit((n||60)*2).get();
      return q.docs.map(x=>x.data())
        .filter(d => d && d.date && (!d.user || d.user === USER_ID))
        .slice(0, n||60);
    } catch(e){
      lastLoadError = e;
      console.error("기록 불러오기 실패:", e);
      throw e;
    }
  }
  return Object.values(memory).sort((a,b)=>b.date.localeCompare(a.date));
}
async function loadOne(d){ if(db){const x=await db.collection(COLLECTION).doc(USER_ID+"_"+d).get(); return x.exists?x.data():null;} return memory[d]||null; }

  entry = { user:USER_ID, date:dateKey, dow, focus:routine.focus, exercises:{}, joints:{} };
  started = {}; doneSets = {}; runDone = false;
  Object.keys(timers).forEach(stopTimer);
  clearInterval(runT); runT = null; keepAwake(false);
  renderDayBar(); syncHeader(); renderToday(); refreshBodyUI();

function renderDayBar(){
  document.getElementById("dayBar").innerHTML = [1,2,3,4,5,6,0].map(d=>
    '<button type="button" data-d="'+d+'" aria-pressed="'+(d===dow)+'"'+(d===realDow?' class="today"':'')+'>'+DAY_KO[d]+'</button>').join("");
  document.querySelectorAll("#dayBar button").forEach(b=>{
    b.onclick = ()=>{
      const d = +b.dataset.d;
      if (d === dow) return;
      if (doneTotal() > 0 && !confirm("진행 중인 세트 기록이 지워집니다. 루틴을 바꿀까요?")) return;
      /* 루틴만 바꾸는 것 — 저장 날짜는 그대로 유지됩니다 */
      dow = d; routine = ROUTINES[d];
      entry.dow = d; entry.focus = routine.focus;

/* 헤더 체중 — 눌러서 수정 */
function refreshBodyUI(){
  const v = document.getElementById("hdBodyVal");
  if (v) v.textContent = bodyKg;
  routine.ex.forEach(ex=>{
    const box = document.querySelector('[data-bench="'+ex.id+'"]');
    if (!box) return;
    const b = benchValues(ex), u = ex.unit==="kg"?"kg":ex.unit;
    const hd = box.querySelector(".bench-hd span:last-child");
    if (hd) hd.textContent = "체중 "+bodyKg+"kg 기준";
    const keys = box.querySelectorAll(".bar-key span");
    ["입문","평균","숙련"].forEach((k,i)=>{ if(keys[i]) keys[i].textContent = k+" "+b[i]+u; });
    updateBench(ex);
  });
}
function initBodyChip(){
  const chip = document.getElementById("hdBody");
  if (!chip || chip.dataset.bound) return;
  chip.dataset.bound = "1";
  chip.onclick = ()=>{
    if (chip.classList.contains("editing")) return;
    chip.classList.add("editing");
    chip.innerHTML = '체중 <input type="number" inputmode="numeric" id="bodyInput" value="'+bodyKg+'" min="30" max="200">kg';
    const inp = chip.querySelector("input");
    inp.focus(); inp.select();
    let dy0 = null, start = 0;
    inp.addEventListener("pointerdown", e=>{ dy0 = e.clientY; start = +inp.value||bodyKg; inp.setPointerCapture(e.pointerId); });
    inp.addEventListener("pointermove", e=>{
      if (dy0 === null) return;
      const d = dy0 - e.clientY;
      if (Math.abs(d) < 4) return;
      inp.blur();
      inp.value = Math.min(200, Math.max(30, start + Math.round(d/9)));
      e.preventDefault();
    });
    const end = ()=>{ dy0 = null; };
    inp.addEventListener("pointerup", end);
    inp.addEventListener("pointercancel", end);
    const commit = ()=>{
      const v = Math.min(200, Math.max(30, +inp.value || bodyKg));
      bodyKg = v;
      chip.classList.remove("editing");
      chip.innerHTML = '체중 <b id="hdBodyVal">'+bodyKg+'</b>kg <span class="pen">✎</span>';
      refreshBodyUI();
      if (db) db.collection(COLLECTION).doc(USER_ID+"_settings").set({bodyKg:v},{merge:true}).catch(()=>{});
      toast("체중 "+v+"kg 기준으로 참고치를 다시 계산했습니다");
    };
    inp.addEventListener("blur", ()=>{ if (dy0 === null) commit(); });
    inp.addEventListener("keydown", e=>{ if (e.key === "Enter") inp.blur(); });
  };
}

function totalSets(){ return routine.ex.reduce((a,e)=> a + (getVal(e.id,"s")||e.s) + (e.warm?1:0), 0) + (routine.run?1:0); }
function doneTotal(){ return Object.values(doneSets).reduce((a,b)=>a+b,0) + (runDone?1:0); }
function updateProgress(){
  const t = totalSets(), d = doneTotal();
  const pct = t ? Math.round(d/t*100) : 0;
  document.getElementById("progBar").style.width = pct+"%";
  document.getElementById("progNum").textContent = d+" / "+t+" 항목";
  document.getElementById("progTxt").textContent =
    !t ? "휴식일" : d===0 ? "시작 전" : d>=t ? "오늘 루틴 완료" : pct+"% 진행 중";
}
function getVal(id,f){
  const el = document.querySelector('[data-ex="'+id+'"] [data-f="'+f+'"]');
  return el ? +el.value : null;
}

/* ═══════════════════════════════════════════════════
   러닝 프로필
   ═══════════════════════════════════════════════════ */
function runProfile(cfg){
  const W=100,H=100,pad=6;
  const sp=cfg.seg.map(s=>s[2]), lo=Math.floor(Math.min(...sp))-0.5, hi=Math.ceil(Math.max(...sp))+0.5;
  const x=m=>pad+(m/cfg.total)*(W-pad*2), y=v=>(H-16)-((v-lo)/(hi-lo))*(H-16-pad);
  let d="",area="";
  cfg.seg.forEach((s,i)=>{ const[a,b,v]=s;
    if(i===0){d+="M"+x(a)+" "+y(v);area+="M"+x(a)+" "+(H-16)+" L"+x(a)+" "+y(v);}
    else{d+=" L"+x(a)+" "+y(v);area+=" L"+x(a)+" "+y(v);}
    d+=" L"+x(b)+" "+y(v);area+=" L"+x(b)+" "+y(v);});
  area+=" L"+x(cfg.total)+" "+(H-16)+" Z";
  let marks="";
  cfg.seg.forEach(s=>{const[a,b,v]=s,mid=(a+b)/2;
    if(b-a>=cfg.total*0.14) marks+='<text x="'+x(mid)+'" y="'+(y(v)-3)+'" font-size="4.4" text-anchor="middle" fill="#16181D" font-weight="700" font-family="JetBrains Mono,monospace">'+v.toFixed(1)+'</text>';});
  let ticks="";
  const step = cfg.total>14?5:3;
  for(let m=0;m<=cfg.total;m+=step){
    ticks+='<line x1="'+x(m)+'" y1="'+(H-16)+'" x2="'+x(m)+'" y2="'+(H-13)+'" stroke="#D2D4CC" stroke-width=".6"/>'
         +'<text x="'+x(m)+'" y="'+(H-7)+'" font-size="4" text-anchor="middle" fill="#787F8A" font-family="JetBrains Mono,monospace">'+m+'</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="러닝 속도 구간 그래프">'
    +'<line x1="'+pad+'" y1="'+(H-16)+'" x2="'+(W-pad)+'" y2="'+(H-16)+'" stroke="#D2D4CC" stroke-width=".7"/>'+ticks
    +'<path d="'+area+'" fill="#1F4FD8" opacity=".08"/><path d="'+d+'" fill="none" stroke="#1F4FD8" stroke-width="1.4" stroke-linejoin="round"/>'+marks+'</svg>';
}
function runTable(cfg){
  return '<table class="rp-tbl"><thead><tr><th>구간</th><th>속도</th><th>비고</th></tr></thead><tbody>'
   + cfg.seg.map((s,i)=>{
      const note = i===0?"걷기 · 관절 예열":(i===cfg.seg.length-1?"쿨다운":(s[2]>=8.4?"본 구간 (최고)":"본 구간"));
      return '<tr><td class="v">'+s[0]+"~"+s[1]+'분</td><td class="v">'+s[2].toFixed(1)+' km/h</td><td>'+note+'</td></tr>';
     }).join("") + '</tbody></table>';
}

/* ═══════════════════════════════════════════════════
   참고 기준 막대
   ═══════════════════════════════════════════════════ */
function benchValues(ex){
  if (ex.bench.type === "bw") return ex.bench.v.map(m => Math.round(bodyKg*m));
  return ex.bench.v.slice();
}
function benchBlock(ex){
  const b = benchValues(ex);
  const unit = ex.unit === "kg" ? "kg" : ex.unit;
  const lbl = ex.bench.label || "무게";
  return '<div class="bench" data-bench="'+ex.id+'">'
   + '<div class="bench-hd"><span>30대 남성 참고치 · '+lbl+'</span><span>체중 '+bodyKg+'kg 기준</span></div>'
   + '<div class="bar">'
   +   '<i class="b1" style="width:100%"></i><i class="b2" style="width:66%"></i><i class="b3" style="width:33%"></i>'
   +   '<span class="me" data-me style="left:0" data-v=""></span>'
   + '</div>'
   + '<div class="bar-key"><span style="flex:1">입문 '+b[0]+unit+'</span><span style="flex:1">평균 '+b[1]+unit+'</span><span style="flex:1">숙련 '+b[2]+unit+'</span></div>'
   + '<p class="bench-msg" data-benchmsg></p></div>';
}
function updateBench(ex){
  const box = document.querySelector('[data-bench="'+ex.id+'"]');
  if (!box) return;
  const b = benchValues(ex);
  const mine = (ex.unit === "kg" && ex.w) ? (getVal(ex.id,"w")||0) : (getVal(ex.id,"r")||0);
  const max = b[2]*1.3;
  const pct = Math.max(2, Math.min(98, mine/max*100));
  const me = box.querySelector("[data-me]");
  me.style.left = pct+"%";
  me.setAttribute("data-v", mine + (ex.unit==="kg"?"kg":ex.unit));
  const msg = box.querySelector("[data-benchmsg]");
  let txt;
  if (mine >= b[2])      txt = "<b>숙련 구간</b>입니다. 여기서부터는 무게보다 자세와 회복이 성과를 만듭니다.";
  else if (mine >= b[1]) txt = "<b>평균 이상</b>입니다. 숙련 구간까지 "+(b[2]-mine)+(ex.unit==="kg"?"kg":ex.unit)+" 남았습니다.";
  else if (mine >= b[0]) txt = "평균까지 <b>"+(b[1]-mine)+(ex.unit==="kg"?"kg":ex.unit)+"</b> 남았습니다.";
  else                   txt = "입문 구간입니다. 지금은 무게보다 동작을 몸에 익히는 시기예요.";
  msg.innerHTML = txt;
}

        +   '<div data-setzone></div>'

    + (STRETCH_PLAN[dow]||[]).map(k=>{

function renderSetZone(ex){
  const card = document.querySelector('[data-ex="'+ex.id+'"]');
  if (!card) return;
  const zone = card.querySelector("[data-setzone]");
  const sets = getVal(ex.id,"s") || ex.s;
  const done = doneSets[ex.id] || 0;
  if (!started[ex.id]){
    zone.innerHTML = '<button class="startbtn" data-start>'+ex.n+(ex.warm?' — 워밍업부터 시작':' 시작')+'</button>'
      + (ex.warm ? '<p class="drag-hint" style="margin:-6px 0 12px">워밍업: '
          + (ex.warm.note ? ex.warm.note : ex.warm.w+'kg × '+ex.warm.r+'회')
          + ' → 본 세트</p>' : '');
    zone.querySelector("[data-start]").onclick = ()=>{ started[ex.id]=true; doneSets[ex.id]=0; renderSetZone(ex); card.classList.add("active"); };
    return;
  }
  const hasWarm = !!ex.warm;
  const total = sets + (hasWarm?1:0);   // 0번 = 워밍업
  let cards = "";
  for (let i=(hasWarm?0:1); i<=sets; i++){
    const idx = hasWarm ? i+1 : i;               // 진행 순서
    const dn  = hasWarm ? done : done;           // done 은 완료한 카드 수
    const pos = hasWarm ? i+1 : i;
    const state = pos<=dn ? "done" : (pos===dn+1 ? "next" : "todo");
    const warm = hasWarm && i===0;
    cards += '<button class="setcard'+(warm?" warmcard":"")+'" data-set="'+pos+'" data-state="'+state+'"'+(state==="todo"?" disabled":"")+'>'
      + '<span class="n">'+(state==="done"?"✓":(warm?"W":i))+'</span>'
      + '<span class="l">'+(state==="done"?"완료":(warm?"워밍업":i+"세트"))+'</span></button>';
  }
  zone.innerHTML = '<div class="sets">'+cards+'</div><div data-msg></div>';
  zone.querySelectorAll('.setcard[data-set]').forEach(b=>{
    b.onclick = ()=>{
      if (b.dataset.state !== "next") return;
      b.classList.add("pop"); setTimeout(()=>b.classList.remove("pop"),130);
      doneSets[ex.id] = +b.dataset.set;
      const totalCards = sets + (ex.warm?1:0);
      const isWarm = ex.warm && doneSets[ex.id] === 1;
      const last = doneSets[ex.id] >= totalCards;
      renderSetZone(ex);
      const msg = card.querySelector("[data-msg]");
      if (last){
        card.classList.remove("active"); card.classList.add("done");
        card.querySelector("[data-check]").innerHTML = '<span class="tick">✓</span>';
        msg.innerHTML = '<div class="react">'+pick(REACT_LAST)+'</div>';
        stopTimer(ex.id);
        if (routine.ex.every(e => (doneSets[e.id]||0) >= (getVal(e.id,"s")||e.s))) toast(pick(REACT_DONE));
      } else if (isWarm) {
        const w = getVal(ex.id,"w") || ex.w;
        msg.innerHTML = '<div class="react">워밍업 완료. '
          + (w ? '이제 본 무게 '+w+'kg로 올리세요.' : '이제 본 세트로 들어갑니다.') + '</div>'
          + '<div class="react rest">휴식 <span class="t" data-timer>'+fmt(60)+'</span> — 무게 바꾸고 준비하세요.</div>';
        startTimer(ex.id, 60, card);
      } else {
        msg.innerHTML = '<div class="react">'+pick(REACT_MID)+'</div>'
          + '<div class="react rest">휴식 <span class="t" data-timer>'+fmt(ex.rest)+'</span> — 다음 세트 준비하세요.</div>';
        startTimer(ex.id, ex.rest, card);
      }
      updateProgress(); autosave();
    };
  });
}
function fmt(s){ return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function startTimer(id, secs, card){
  stopTimer(id);
  let left = secs;
  timers[id] = setInterval(()=>{
    left--;
    const el = card.querySelector("[data-timer]");
    if (!el){ stopTimer(id); return; }
    if (left <= 0){ el.textContent = "00:00"; el.parentElement.innerHTML = '휴식 끝. 다음 세트 시작하세요.'; stopTimer(id); return; }
    el.textContent = fmt(left);
  }, 1000);
}
function stopTimer(id){ if (timers[id]){ clearInterval(timers[id]); delete timers[id]; } }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* 지난 기록으로 오늘 무게 제안 */
function stepUp(ex, w){
  if (ex.unit !== "kg") return null;
  return w >= 20 ? w + 5 : w + 1;   // 머신은 한 칸, 아령은 1kg
}
function applySuggestions(logs){
  routine.ex.forEach(ex=>{
    const card = document.querySelector('[data-ex="'+ex.id+'"]');
    if (!card) return;
    const box = card.querySelector("[data-sugg]");
    const prev = logs.find(L => L.date !== dateKey && L.exercises && L.exercises[ex.id] && L.exercises[ex.id].doneSets > 0);
    if (!prev){ box.innerHTML = ""; return; }
    const o = prev.exercises[ex.id];
    const full = o.doneSets >= (o.sets||0) + (ex.warm?1:0);
    const cur = o.weight || 0;
    let html = "";
    if (o.rpe && o.rpe <= 6 && full){
      const up = stepUp(ex, cur);
      if (up){
        html = '<div class="sugg">지난 '+prev.date.slice(5)+' <b>'+cur+'kg</b>에서 강도 '+o.rpe+'로 여유가 있었습니다. 오늘 <b>'+up+'kg</b> 어떨까요?'
             + '<button type="button" data-apply="'+up+'">적용</button></div>';
      } else {
        const r = (o.reps||ex.r) + 2;
        html = '<div class="sugg">지난번 강도 '+o.rpe+'로 여유가 있었습니다. 오늘 <b>'+r+'</b>회로 올려보세요.'
             + '<button type="button" data-applyr="'+r+'">적용</button></div>';
      }
    } else if (o.rpe && o.rpe >= 9){
      html = '<div class="sugg hold">지난 '+prev.date.slice(5)+' 강도 '+o.rpe+'로 한계에 가까웠습니다. 오늘은 <b>'+cur+'kg 그대로</b> 유지하세요.</div>';
    } else if (!full){
      html = '<div class="sugg hold">지난 '+prev.date.slice(5)+'에 계획한 세트를 다 못 채웠습니다. 오늘은 <b>같은 무게</b>로 채우는 걸 목표로.</div>';
    } else {
      html = '<div class="sugg">지난 '+prev.date.slice(5)+' '+(cur?cur+'kg · ':'')+o.reps+'회 × '+o.doneSets+'세트'+(o.rpe?' · 강도 '+o.rpe:'')+'</div>';
    }
    box.innerHTML = html;
    const ab = box.querySelector("[data-apply]"), rb = box.querySelector("[data-applyr]");
    if (ab) ab.onclick = ()=>{
      const el = card.querySelector('[data-f="w"]'); if (!el) return;
      el.value = ab.dataset.apply; el.dispatchEvent(new Event("change"));
      toast("무게를 "+ab.dataset.apply+"kg로 맞췄습니다");
      ab.parentElement.innerHTML = "오늘 목표: <b>"+ab.dataset.apply+"kg</b> — 자세가 흔들리면 즉시 되돌리세요.";
    };
    if (rb) rb.onclick = ()=>{
      const el = card.querySelector('[data-f="r"]');
      el.value = rb.dataset.applyr; el.dispatchEvent(new Event("change"));
      toast("횟수를 "+rb.dataset.applyr+"회로 맞췄습니다");
      rb.parentElement.innerHTML = "오늘 목표: <b>"+rb.dataset.applyr+"회</b>";
    };
  });
}

/* ═══ 러닝 스톱워치 ═══ */
let runT = null, runSec = 0, runSegIdx = -1, runCfg = null;
function initRunner(cfg){
  runCfg = cfg; runSec = 0; runSegIdx = -1;
  clearInterval(runT); runT = null;
  const track = document.getElementById("rTrack");
  track.innerHTML = cfg.seg.map(sg=>'<i style="flex:'+(sg[1]-sg[0])+'"></i>').join("");
  document.getElementById("rStart").onclick = toggleRun;
  document.getElementById("rReset").onclick = ()=>{
    clearInterval(runT); runT=null; runSec=0; runSegIdx=-1; keepAwake(false);
    document.getElementById("rStart").textContent = "러닝 시작";
    document.getElementById("rStart").classList.add("primary");
    paintRunner();
  };
  paintRunner();
}
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on){ if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); }
    else if (wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && runT) keepAwake(true); });

function toggleRun(){
  const b = document.getElementById("rStart");
  if (runT){ clearInterval(runT); runT=null; keepAwake(false); b.textContent="이어서 하기"; b.classList.add("primary"); return; }
  b.textContent = "일시정지"; b.classList.remove("primary"); keepAwake(true);
  runT = setInterval(()=>{ runSec++; paintRunner(); }, 1000);
  paintRunner();
}
function segAt(sec){
  const m = sec/60;
  for (let i=0;i<runCfg.seg.length;i++) if (m < runCfg.seg[i][1]) return i;
  return -1;
}
function paintRunner(){
  const cfg = runCfg, i = segAt(runSec);
  const speedEl = document.getElementById("rSpeed");
  const total = cfg.total*60;
  document.getElementById("rClock").textContent = fmt(Math.min(runSec,total)) + " / " + fmt(total);
  if (i === -1){
    speedEl.textContent = "0.0";
    document.getElementById("rSub").innerHTML = "<b>러닝 완료</b> — 아래에서 거리·강도를 기록하세요";
    document.querySelectorAll("#rTrack i").forEach(el=>{el.className="past";});
    if (runT){ clearInterval(runT); runT=null; keepAwake(false);
      document.getElementById("rStart").textContent = "러닝 시작";
      document.getElementById("rStart").classList.add("primary");
      flash("끝", "쿨다운까지 완료");
      const rb = document.getElementById("runDone");
      if (rb && rb.getAttribute("aria-pressed") !== "true") rb.click();
    }
    return;
  }
  const sg = cfg.seg[i], endSec = sg[1]*60, left = endSec - runSec;
  speedEl.textContent = sg[2].toFixed(1);
  const nxt = cfg.seg[i+1];
  document.getElementById("rSub").innerHTML =
    "이 구간 <b>" + fmt(left) + "</b> 남음" +
    (nxt ? " · 다음 <b>" + nxt[2].toFixed(1) + " km/h</b>" : " · 다음 종료");
  document.querySelectorAll("#rTrack i").forEach((el,k)=>{
    el.className = k<i ? "past" : (k===i ? "now" : "");
    if (k===i) el.style.setProperty("--p", ((runSec-sg[0]*60)/(endSec-sg[0]*60)*100)+"%");
  });
  if (i !== runSegIdx){
    const prev = runSegIdx;
    runSegIdx = i;
    if (prev !== -1 && runT){
      const up = sg[2] > cfg.seg[prev][2];
      flash(sg[2].toFixed(1), (up ? "속도 올리기" : "속도 낮추기") + " · km/h");
      if (navigator.vibrate) navigator.vibrate(up ? [120,60,120] : 200);
    }
  }
}
function flash(v, t){
  const f = document.getElementById("rFlash");
  if (!f) return;
  f.querySelector(".fv").textContent = v;
  f.querySelector(".ft").textContent = t;
  f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
}

   + '</div></div>';

function bindToday(){
  /* 스테퍼 */
  document.querySelectorAll(".step").forEach(box=>{
    const input = box.querySelector("input");
    const stepBy = input.dataset.run === "dist" ? 0.5 : 1;
    box.querySelectorAll("button[data-step]").forEach(b=>{
      b.onclick = ()=>{
        let v = (+input.value || 0) + stepBy * (+b.dataset.step);
        const min = input.min!=="" ? +input.min : 0;
        const max = input.max!=="" ? +input.max : Infinity;
        v = Math.min(max, Math.max(min, +v.toFixed(1)));
        input.value = v;
        input.dispatchEvent(new Event("change"));
      };
    });
    /* 위아래로 밀어서 조절 */
    let dragY = null, dragStart = 0, moved = false;
    const PX = 9;   // 9px 당 1단위
    input.addEventListener("pointerdown", e=>{
      if (e.pointerType === "mouse" && e.button !== 0) return;
      dragY = e.clientY; dragStart = +input.value || 0; moved = false;
      input.setPointerCapture(e.pointerId);
    });
    input.addEventListener("pointermove", e=>{
      if (dragY === null) return;
      const dy = dragY - e.clientY;
      if (Math.abs(dy) < 4) return;
      if (!moved){ moved = true; box.classList.add("dragging"); input.blur(); }
      const min = input.min!=="" ? +input.min : 0;
      const max = input.max!=="" ? +input.max : Infinity;
      let v = dragStart + Math.round(dy/PX) * stepBy;
      v = Math.min(max, Math.max(min, +v.toFixed(1)));
      if (v !== +input.value){ input.value = v; input.dispatchEvent(new Event("change")); }
      e.preventDefault();
    });
    const endDrag = e=>{
      if (dragY === null) return;
      dragY = null; box.classList.remove("dragging");
      if (moved && e) e.preventDefault();
    };
    input.addEventListener("pointerup", endDrag);
    input.addEventListener("pointercancel", endDrag);

    input.addEventListener("change", ()=>{
      const card = box.closest("[data-ex]");
      if (!card) return;
      const ex = ALL_EX.find(e=>e.id===card.dataset.ex);
      if (!ex) return;
      updateBench(ex);
      if (input.dataset.f === "s") renderSetZone(ex);
      updateProgress();
    });
  });
  /* 강도 */
  document.querySelectorAll("[data-scale]").forEach(box=>{
    const key = box.dataset.scale, out = box.querySelector("[data-out]");
    box.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
        b.setAttribute("aria-pressed","true");
        const v = +b.dataset.v;
        out.textContent = v+" / 10 · "+(v<=3?"여유":v<=6?"적당":v<=8?"힘듦":"한계");
        out.style.color = v<=6?"var(--ok)":v<=8?"var(--caution)":"var(--alert)";
        if (key === "run") entry.runRpe = v;
        else { entry.exercises[key] = entry.exercises[key]||{}; entry.exercises[key].rpe = v; }
        if (v >= 9) toast("강도 9 이상입니다. 다음 세트는 무게를 낮추거나 여기서 마무리하세요.");
      };
    });
  });
  /* 관절 */
  document.querySelectorAll(".joint").forEach(row=>{
    const id = row.dataset.j; entry.joints[id] = 0;
    row.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        row.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
        b.setAttribute("aria-pressed","true");
        entry.joints[id] = +b.dataset.v;
        document.getElementById("jointWarn").hidden = !Object.values(entry.joints).some(v=>v>=2);
      };
    });
  });
  /* 저장 */
  const btn = document.getElementById("btnSave");
  if (btn) btn.onclick = async ()=>{
    collect();
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "저장 중…";
    try { await saveLog(dateKey, JSON.parse(JSON.stringify(entry))); toast("저장했습니다"); }
    catch(e){
      console.error(e);
      toast(e && e.code === "permission-denied"
        ? "저장 실패 — Firestore 규칙에 workout_logs 허용이 필요합니다"
        : "저장 실패 — 연결을 확인하세요");
    }
    btn.disabled = false; btn.textContent = label;
  };
}

function collect(){
  document.querySelectorAll("[data-ex]").forEach(card=>{
    const id = card.dataset.ex, o = entry.exercises[id]||{};
    const m = ALL_EX.find(e=>e.id===id);
    o.weight = (m && !m.w) ? 0 : (getVal(id,"w")||0);
    o.reps = getVal(id,"r")||0; o.sets = getVal(id,"s")||0;
    o.doneSets = doneSets[id]||0;
    o.name = m?m.n:id;
    entry.exercises[id] = o;
  });
  const rd = document.querySelector('[data-run="dist"]'), rm = document.querySelector('[data-run="min"]');
  if (rd) entry.run = { km:+rd.value||0, min:+rm.value||0, plan:routine.run, done:runDone };
  entry.savedAt = new Date().toISOString();
  return entry;
}

/* 세트를 끝낼 때마다 조용히 저장 — 앱이 닫혀도 진행 상황이 남습니다 */
let autoT = null;
function autosave(){
  clearTimeout(autoT);
  autoT = setTimeout(()=>{
    collect();
    saveLog(dateKey, JSON.parse(JSON.stringify(entry))).catch(()=>{});
  }, 600);
}

/* 저장해둔 오늘 기록 이어서 하기 */
function restore(prev){
  if (!prev) return false;
  if (prev.dow !== undefined && prev.dow !== dow){
    dow = prev.dow; routine = ROUTINES[dow];
    entry.dow = dow; entry.focus = routine.focus;
    renderDayBar(); syncHeader(); renderToday();
  }
  Object.entries(prev.exercises||{}).forEach(([id,o])=>{
    const card = document.querySelector('[data-ex="'+id+'"]');
    if (!card) return;
    const set = (f,v)=>{ const el = card.querySelector('[data-f="'+f+'"]'); if (el && v) el.value = v; };
    set("w", o.weight); set("r", o.reps); set("s", o.sets);
    entry.exercises[id] = Object.assign({}, o);
    if (o.rpe){
      const b = card.querySelector('[data-scale] button[data-v="'+o.rpe+'"]');
      if (b) b.click();
    }
    if (o.doneSets > 0){ started[id] = true; doneSets[id] = o.doneSets; }
    const ex = ALL_EX.find(e=>e.id===id);
    if (ex){ renderSetZone(ex); updateBench(ex); }

    const cardTotal = (o.sets||0) + ((ex&&ex.warm)?1:0);
    if (o.doneSets >= cardTotal && o.doneSets > 0){
      card.classList.add("done");
      const c = card.querySelector("[data-check]"); if (c) c.innerHTML = '<span class="tick">✓</span>';
    } else if (o.doneSets > 0) card.classList.add("active");
  });
  Object.entries(prev.joints||{}).forEach(([id,v])=>{
    const b = document.querySelector('.joint[data-j="'+id+'"] button[data-v="'+v+'"]');
    if (b) b.click();
  });
  if (prev.run){
    const rd = document.querySelector('[data-run="dist"]'), rm = document.querySelector('[data-run="min"]');
    if (rd && prev.run.km) rd.value = prev.run.km;
    if (rm && prev.run.min) rm.value = prev.run.min;
    if (prev.runRpe){ const b = document.querySelector('[data-scale="run"] button[data-v="'+prev.runRpe+'"]'); if (b) b.click(); }
    if (prev.run.done){ const rb = document.getElementById("runDone"); if (rb) rb.click(); }
  }
  updateProgress();
  return true;
}

/* ═══════════════════════════════════════════════════
   기록 / 추세 / 방법
   ═══════════════════════════════════════════════════ */
async function renderLog(){
  const el = document.getElementById("pane-log");
  el.innerHTML = '<p class="empty">불러오는 중…</p>';
  let logs = [], err = null;
  try { logs = await loadLogs(60); } catch(e){ err = e; }
  if (err){
    el.innerHTML = '<div class="card"><div class="card-bd">'
      + '<h3 style="font-size:14px;margin-bottom:6px;color:var(--alert)">기록을 불러오지 못했습니다</h3>'
      + '<p class="spec">' + (err.code === "permission-denied"
          ? 'Firebase 콘솔 → Firestore → 규칙에 <b>workout_logs</b> 컬렉션 허용을 추가하고 게시해야 합니다.'
          : '오류: ' + (err.code || err.message || '알 수 없음')) + '</p></div></div>';
    return;
  }
  if (!logs.length){ el.innerHTML = '<p class="empty">아직 기록이 없습니다.<br>오늘 탭에서 첫 운동을 저장해 보세요.</p>'; return; }
  el.innerHTML = '<div class="eyebrow">최근 '+logs.length+'일</div><div class="log">' + logs.map(L=>{
    const ex = Object.values(L.exercises||{});
    const worst = Math.max(0, ...Object.values(L.joints||{}));
    const chip = worst>=2 ? '<span class="chip bad">'+JOINT_OPT[worst]+'</span>' : worst===1 ? '<span class="chip warn">뻐근함</span>' : '<span class="chip ok">관절 이상 없음</span>';
    const run = L.run && L.run.km ? '<div class="log-row"><span>러닝</span><span class="v">'+L.run.km+'km · '+L.run.min+'분'+(L.runRpe?" · 강도 "+L.runRpe:"")+'</span></div>' : "";
    return '<div class="log-item"><span class="log-date">'+L.date+'</span><span class="log-focus">'+DAY_KO[L.dow]+' · '+L.focus+'</span>'+chip
      + '<div class="log-rows">'+run+ex.map(e=>'<div class="log-row"><span>'+(e.name||"")+'</span><span class="v">'
      + (e.weight?e.weight+"kg · ":"")+e.reps+"×"+(e.doneSets===undefined?e.sets:e.doneSets)
      + (e.doneSets!==undefined&&e.doneSets<e.sets?" (계획 "+e.sets+")":"")
      + (e.rpe?" · 강도 "+e.rpe:"")+'</span></div>').join("")+'</div></div>';
  }).join("") + '</div>';
}
let trendLogs = null;
async function renderTrend(){
  const el = document.getElementById("pane-trend");
  el.innerHTML = '<p class="empty">불러오는 중…</p>';
  let terr = null;
  try { trendLogs = await loadLogs(60); } catch(e){ trendLogs = []; terr = e; }
  if (terr){ el.innerHTML = '<p class="empty">기록을 불러오지 못했습니다.<br>기록 탭에서 자세한 원인을 확인하세요.</p>'; return; }
  if (!trendLogs.length){ el.innerHTML = '<p class="empty">기록이 쌓이면 무게와 강도 변화를 여기서 볼 수 있습니다.</p>'; return; }
  const ids = [...new Set(trendLogs.flatMap(L=>Object.keys(L.exercises||{})))];
  el.innerHTML = '<div class="eyebrow">종목별 추세</div><select id="trendSel">'
    + ids.map(id=>{const m=ALL_EX.find(e=>e.id===id); return '<option value="'+id+'">'+(m?m.n:id)+'</option>';}).join("")
    + '</select><div class="card trend" style="margin-top:12px"><div class="card-bd" id="trendBox"></div></div>'
    + '<div class="card"><div class="card-bd"><h3 style="font-size:14px;margin-bottom:6px">증량 판단</h3>'
    + '<p class="spec">목표 횟수를 모든 세트에서 자세 흐트러짐 없이 끝내고 마지막 세트에도 2~3회 여유가 있으면(강도 6 이하) 다음 주에 한 칸 올립니다. 2주 연속 목표를 못 채우면 그대로 유지하세요.</p></div></div>';
  document.getElementById("trendSel").onchange = e=>drawTrend(e.target.value);
  drawTrend(ids[0]);
}
let trendChart = null;
function drawTrend(id){
  const pts = trendLogs.filter(L=>L.exercises&&L.exercises[id])
    .map(L=>({d:L.date,w:L.exercises[id].weight||0,rpe:L.exercises[id].rpe||0,
              done:L.exercises[id].doneSets||0,reps:L.exercises[id].reps||0}))
    .sort((a,b)=>a.d.localeCompare(b.d));
  const box = document.getElementById("trendBox");
  const ex = ALL_EX.find(e=>e.id===id);
  if (pts.length < 2){
    box.innerHTML = '<p class="spec" style="text-align:center;padding:24px 0">기록이 2회 이상 쌓이면 그래프가 나타납니다.</p>';
    return;
  }
  box.innerHTML = '<div style="height:200px;position:relative"><canvas id="trendCanvas"></canvas></div><p class="spec" id="trendNote" style="margin-top:12px"></p>';
  if (trendChart) trendChart.destroy();
  const weighted = ex && ex.unit === "kg" && ex.w;
  trendChart = new Chart(document.getElementById("trendCanvas"), {
    type: "line",
    data: {
      labels: pts.map(p=>p.d.slice(5)),
      datasets: [
        { label: weighted ? "무게 (kg)" : "횟수",
          data: pts.map(p=> weighted ? p.w : p.reps),
          borderColor: "#1F4FD8", backgroundColor: "rgba(31,79,216,.08)",
          borderWidth: 2, tension: .25, fill: true, pointRadius: 3, pointBackgroundColor: "#1F4FD8", yAxisID: "y" },
        { label: "강도 (1–10)",
          data: pts.map(p=>p.rpe||null),
          borderColor: "#C97A0B", borderWidth: 1.5, borderDash: [4,3],
          tension: .25, fill: false, pointRadius: 2.5, pointBackgroundColor: "#C97A0B", yAxisID: "y1", spanGaps: true }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { boxWidth: 12, font: { size: 11, family: "Pretendard" }, color: "#3C4149" } },
        tooltip: { titleFont:{family:"Pretendard"}, bodyFont:{family:"Pretendard"} }
      },
      scales: {
        x: { grid: { color: "#EFEFEA" }, ticks: { font: { size: 10, family: "JetBrains Mono" }, color: "#787F8A" } },
        y: { position: "left", grid: { color: "#EFEFEA" },
             ticks: { font: { size: 10, family: "JetBrains Mono" }, color: "#1F4FD8" } },
        y1: { position: "right", min: 0, max: 10, grid: { drawOnChartArea: false },
              ticks: { stepSize: 2, font: { size: 10, family: "JetBrains Mono" }, color: "#C97A0B" } }
      }
    }
  });
  const last = pts[pts.length-1], first = pts[0];
  const diff = weighted ? last.w - first.w : last.reps - first.reps;
  const unit = weighted ? "kg" : "회";
  document.getElementById("trendNote").innerHTML =
    "최근 " + (weighted ? last.w+"kg" : last.reps+"회") + " · 강도 " + (last.rpe||"—")
    + (diff > 0 ? " — 처음 기록 대비 <b>+"+diff+unit+"</b>" : "")
    + (last.rpe && last.rpe <= 6 ? " · 여유가 있으면 다음 주 증량 대상입니다." : "")
    + (last.rpe && last.rpe >= 9 ? " · 한계에 가까웠습니다. 다음 주는 같은 무게로 유지하세요." : "");
}

const st = document.createElement("style");
st.textContent = ".lb{font-size:9px;fill:#787F8A;stroke:none;font-family:Pretendard,sans-serif;font-weight:600}.mv{stroke:#1F4FD8}";
document.head.appendChild(st);

const panes = {today:renderToday, log:renderLog, trend:renderTrend};
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected","false"));
    b.setAttribute("aria-selected","true");
    Object.keys(panes).forEach(k=>document.getElementById("pane-"+k).hidden = (k!==b.dataset.p));
    window.scrollTo(0,0);
    if (b.dataset.p !== "today") panes[b.dataset.p]();
  };
});
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("on"),2600); }

async function boot(){
  try {
    if (db){
      const d = await db.collection(COLLECTION).doc(USER_ID+"_settings").get();
      if (d.exists && d.data().bodyKg) bodyKg = d.data().bodyKg;
    }
  } catch(e){}
  initDatePicker();
  renderDayBar(); syncHeader(); initBodyChip(); renderToday(); refreshBodyUI();
  try {
    const logs = await loadLogs(60);
    applySuggestions(logs);
    const mine = logs.find(L=>L.date===dateKey);
    if (restore(mine)) { applySuggestions(logs); toast("오늘 기록을 불러왔습니다 — 이어서 하세요"); }
  } catch(e){}
}
boot();
</script>
